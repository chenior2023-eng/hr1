<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Management Readiness Character Test</title>
  <style>
    :root {
      --bg: #f3f6ff;
      --card: #ffffff;
      --ink: #1f2937;
      --muted: #6b7280;
      --primary: #4f46e5;
      --primary-dark: #4338ca;
      --accent: #f59e0b;
      --good: #16a34a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #eef2ff, #f8fafc);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .app {
      width: 100%;
      max-width: 860px;
      background: var(--card);
      border-radius: 20px;
      box-shadow: 0 12px 36px rgba(31, 41, 55, 0.12);
      overflow: hidden;
    }

    .header {
      padding: 24px 28px 10px;
      border-bottom: 1px solid #e5e7eb;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 1.5rem;
    }

    .header p {
      margin: 0;
      color: var(--muted);
      line-height: 1.4;
    }

    .content {
      padding: 24px 28px 28px;
    }

    .question-card {
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 14px;
    }

    .question-card h3 {
      margin: 0 0 12px;
      font-size: 1rem;
    }

    .answers {
      display: grid;
      gap: 8px;
    }

    label {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      color: #111827;
      line-height: 1.35;
      cursor: pointer;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 18px;
    }

    button {
      border: 0;
      border-radius: 999px;
      background: var(--primary);
      color: white;
      font-weight: bold;
      padding: 12px 18px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    button:hover { background: var(--primary-dark); }

    .warning {
      color: #dc2626;
      font-size: 0.95rem;
      margin: 8px 0 0;
      display: none;
    }

    .result {
      display: none;
      gap: 18px;
      align-items: center;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 20px;
      margin-top: 10px;
    }

    .avatar {
      font-size: 4rem;
      width: 96px;
      height: 96px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #ede9fe;
      flex: 0 0 auto;
    }

    .badge {
      display: inline-block;
      background: #ecfeff;
      color: #0f766e;
      border: 1px solid #99f6e4;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 0.8rem;
      margin-bottom: 6px;
    }

    .score {
      margin-top: 8px;
      color: var(--good);
      font-weight: bold;
    }

    .retake {
      margin-top: 14px;
      background: var(--accent);
      color: #111827;
    }

    .retake:hover { background: #d97706; }

    @media (max-width: 680px) {
      .result { flex-direction: column; text-align: center; }
      .actions { justify-content: center; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <h1>Management Readiness Character Test</h1>
      <p>
        Answer honestly. This MBTI-style quiz estimates if you are ready for management level
        without a formal training program.
      </p>
    </div>

    <form id="quizForm" class="content">
      <div id="questionList"></div>
      <p id="warning" class="warning">Please answer all questions first.</p>
      <div class="actions">
        <button type="submit">See My Result</button>
      </div>

      <div id="resultCard" class="result">
        <div id="avatar" class="avatar">🦸</div>
        <div>
          <span class="badge">Your Character</span>
          <h2 id="characterName" style="margin: 0 0 6px;"></h2>
          <p id="characterDesc" style="margin: 0; color: #374151;"></p>
          <p id="scoreText" class="score"></p>
          <button type="button" class="retake" id="retakeBtn">Retake Test</button>
        </div>
      </div>
    </form>
  </div>

  <script>
    const questions = [
      {
        text: "When your team misses a deadline, what do you do first?",
        options: [
          { label: "Blame the person responsible", score: 0 },
          { label: "Calmly identify root causes with the team", score: 4 },
          { label: "Do everything yourself next time", score: 1 },
          { label: "Ignore it and move on", score: 0 }
        ]
      },
      {
        text: "How comfortable are you making decisions with limited information?",
        options: [
          { label: "Very uncomfortable", score: 1 },
          { label: "Somewhat comfortable", score: 3 },
          { label: "Very comfortable and can explain my logic", score: 4 },
          { label: "I avoid deciding", score: 0 }
        ]
      },
      {
        text: "How do you handle team conflict?",
        options: [
          { label: "Let them solve it themselves only", score: 2 },
          { label: "Listen to both sides and mediate fairly", score: 4 },
          { label: "Take one side quickly", score: 1 },
          { label: "Avoid conflict completely", score: 0 }
        ]
      },
      {
        text: "What best describes your communication style?",
        options: [
          { label: "Clear, direct, and empathetic", score: 4 },
          { label: "Direct but often harsh", score: 2 },
          { label: "Friendly but unclear", score: 2 },
          { label: "I communicate only when asked", score: 0 }
        ]
      },
      {
        text: "How often do you coach or support others to grow?",
        options: [
          { label: "Rarely", score: 1 },
          { label: "Sometimes", score: 3 },
          { label: "Regularly with specific feedback", score: 4 },
          { label: "Never", score: 0 }
        ]
      },
      {
        text: "When priorities change suddenly, you usually...",
        options: [
          { label: "Panic and freeze", score: 0 },
          { label: "Adapt plan and align team quickly", score: 4 },
          { label: "Complain but continue", score: 2 },
          { label: "Wait for others to decide", score: 1 }
        ]
      },
      {
        text: "How do you balance results and people well-being?",
        options: [
          { label: "Only results matter", score: 1 },
          { label: "Only people matter", score: 2 },
          { label: "I balance both and communicate trade-offs", score: 4 },
          { label: "I don't think about this", score: 0 }
        ]
      },
      {
        text: "How accountable are you when mistakes happen?",
        options: [
          { label: "I defend myself first", score: 1 },
          { label: "I admit mistakes and lead improvements", score: 4 },
          { label: "I stay silent", score: 0 },
          { label: "I blame conditions", score: 1 }
        ]
      }
    ];

    const characters = [
      {
        min: 0,
        max: 11,
        name: "The Rookie Rabbit",
        emoji: "🐰",
        desc: "You have potential, but need more structure and experience before taking a full management role."
      },
      {
        min: 12,
        max: 19,
        name: "The Steady Fox",
        emoji: "🦊",
        desc: "You show many leadership habits. With guided practice, you can step into management confidently."
      },
      {
        min: 20,
        max: 26,
        name: "The Team Captain Bear",
        emoji: "🐻",
        desc: "You are likely ready for management level now, even without a formal program. You think like a leader."
      },
      {
        min: 27,
        max: 32,
        name: "The Vision Eagle",
        emoji: "🦅",
        desc: "Excellent readiness. You balance strategy, people, and execution like a strong modern manager."
      }
    ];

    const questionList = document.getElementById("questionList");
    const warning = document.getElementById("warning");
    const quizForm = document.getElementById("quizForm");
    const resultCard = document.getElementById("resultCard");
    const avatar = document.getElementById("avatar");
    const characterName = document.getElementById("characterName");
    const characterDesc = document.getElementById("characterDesc");
    const scoreText = document.getElementById("scoreText");
    const retakeBtn = document.getElementById("retakeBtn");

    function renderQuestions() {
      questionList.innerHTML = "";
      questions.forEach((q, qIndex) => {
        const card = document.createElement("div");
        card.className = "question-card";

        const title = document.createElement("h3");
        title.textContent = `${qIndex + 1}. ${q.text}`;
        card.appendChild(title);

        const answerWrap = document.createElement("div");
        answerWrap.className = "answers";

        q.options.forEach((option, oIndex) => {
          const id = `q${qIndex}_o${oIndex}`;
          const label = document.createElement("label");
          label.setAttribute("for", id);

          const input = document.createElement("input");
          input.type = "radio";
          input.name = `question_${qIndex}`;
          input.id = id;
          input.value = option.score;

          const span = document.createElement("span");
          span.textContent = option.label;

          label.appendChild(input);
          label.appendChild(span);
          answerWrap.appendChild(label);
        });

        card.appendChild(answerWrap);
        questionList.appendChild(card);
      });
    }

    function getCharacter(score) {
      return characters.find(c => score >= c.min && score <= c.max) || characters[0];
    }

    quizForm.addEventListener("submit", (event) => {
      event.preventDefault();
      warning.style.display = "none";

      let total = 0;
      for (let i = 0; i < questions.length; i += 1) {
        const selected = document.querySelector(`input[name="question_${i}"]:checked`);
        if (!selected) {
          warning.style.display = "block";
          resultCard.style.display = "none";
          return;
        }
        total += Number(selected.value);
      }

      const character = getCharacter(total);
      avatar.textContent = character.emoji;
      characterName.textContent = character.name;
      characterDesc.textContent = character.desc;
      scoreText.textContent = `Readiness Score: ${total} / 32`;
      resultCard.style.display = "flex";
      resultCard.scrollIntoView({ behavior: "smooth", block: "start" });
    });

    retakeBtn.addEventListener("click", () => {
      quizForm.reset();
      warning.style.display = "none";
      resultCard.style.display = "none";
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    renderQuestions();
  </script>
</body>
</html>
